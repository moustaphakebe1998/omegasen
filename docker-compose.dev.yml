# Base PostgreSQL locale pour le développement et les tests.
# Usage : npm run db:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: omegasen-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: omegasen
      POSTGRES_PASSWORD: omegasen
      POSTGRES_DB: omegasen
    ports:
      - "54329:5432"
    volumes:
      - omegasen-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omegasen"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  omegasen-pg-dev:
