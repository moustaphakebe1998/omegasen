version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omegasen-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - omegasen-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  omegasen-net:
    driver: bridge
